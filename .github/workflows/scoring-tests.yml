name: scoring-tests
on:
  push:
    branches: [main]
    paths: ["scoring/**", "agent/**", "ml/features/**", "ml/evaluation/**", "ml/models/bilstm/threshold.py", ".github/workflows/scoring-tests.yml"]
  pull_request:
    paths: ["scoring/**", "agent/**", "ml/features/**", "ml/evaluation/**", "ml/models/bilstm/threshold.py", ".github/workflows/scoring-tests.yml"]
defaults:
  run:
    working-directory: scoring
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: pytest tests -v
