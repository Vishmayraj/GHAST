name: ml-evaluation-tests

on:
  push:
    branches: [main]
    paths:
      - "ml/evaluation/**"
      - ".github/workflows/ml-evaluation-tests.yml"
  pull_request:
    paths:
      - "ml/evaluation/**"
      - ".github/workflows/ml-evaluation-tests.yml"

defaults:
  run:
    working-directory: ml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest evaluation/tests -v
