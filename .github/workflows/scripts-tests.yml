name: scripts-tests
on:
  push:
    branches: [main]
    paths: ["scripts/**", "backend/models/schema.sql", "backend/models/migrations/**", ".github/workflows/scripts-tests.yml"]
  pull_request:
    paths: ["scripts/**", "backend/models/schema.sql", "backend/models/migrations/**", ".github/workflows/scripts-tests.yml"]
defaults:
  run:
    working-directory: scripts
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: pytest tests -v
