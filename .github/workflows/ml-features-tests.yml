name: ml-features-tests

on:
  push:
    branches: [main]
    paths:
      - "ml/features/**"
      - "ml/requirements*.txt"
      - ".github/workflows/ml-features-tests.yml"
  pull_request:
    paths:
      - "ml/features/**"
      - "ml/requirements*.txt"
      - ".github/workflows/ml-features-tests.yml"

defaults:
  run:
    working-directory: ml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest features/tests -v
