name: ingestion-tests

on:
  push:
    branches: [main]
    paths:
      - "ingestion/**"
      - ".github/workflows/ingestion-tests.yml"
  pull_request:
    paths:
      - "ingestion/**"
      - ".github/workflows/ingestion-tests.yml"

defaults:
  run:
    working-directory: ingestion

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests -v
