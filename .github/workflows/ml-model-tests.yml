name: ml-model-tests
on:
  push:
    branches: [main]
    paths: ["ml/models/bilstm/**", "ml/training/**", "ml/features/**", "ml/requirements*.txt", ".github/workflows/ml-model-tests.yml"]
  pull_request:
    paths: ["ml/models/bilstm/**", "ml/training/**", "ml/features/**", "ml/requirements*.txt", ".github/workflows/ml-model-tests.yml"]
defaults:
  run:
    working-directory: ml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: pytest models/bilstm/tests -v
