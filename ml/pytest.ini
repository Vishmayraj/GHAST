[pytest]
# Bare `pytest` (as every ml-*-tests.yml workflow runs it, with
# working-directory: ml) does not add the invocation directory to sys.path the
# way `python -m pytest` does. With ml/__init__.py present, pytest's own
# rootdir walk-up lands one level too high (at the repo root) and flat imports
# like "from features.extract import ..." or "from models.bilstm.model import
# ..." fail to resolve, even though they work fine when run locally with
# `python -m pytest`. This one-line fix makes bare `pytest` behave the same as
# `python -m pytest` from this directory, for every workflow that shares this
# working-directory/bare-pytest pattern (ml-features-tests, ml-model-tests,
# ml-training-tests, ml-evaluation-tests).
pythonpath = .
