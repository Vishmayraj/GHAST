[pytest]
# Bare `pytest` (as .github/workflows/agent-tests.yml runs it) does not add the
# invocation directory to sys.path the way `python -m pytest` does; with
# agent/__init__.py present, pytest's own rootdir walk-up lands one level too
# high and "from orchestrator...." fails to resolve. `.` fixes that for this
# package's own modules; `../ml` is needed too now that
# orchestrator/state_machine.py imports models.bilstm.threshold from the
# sibling ml/ package (see ml/pytest.ini for the same fix on that side).
pythonpath = . ../ml
